name: Build Windows CLI (paste-fix)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "crates/codegen/xai-grok-pager/**"
      - "crates/codegen/xai-ratatui-textarea/**"
      - "crates/codegen/xai-grok-pager-bin/**"
      - "crates/codegen/xai-grok-shell/**"
      - "crates/build/xai-proto-build/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  windows-x64:
    name: Windows x64 release
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "29.3"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prefer system protoc on Windows
        shell: pwsh
        run: |
          if (Test-Path bin/protoc) {
            Move-Item bin/protoc bin/protoc.unix-dotslash -Force
          }
          $protoc = (Get-Command protoc).Source
          Write-Host "PROTOC=$protoc"
          protoc --version
          "PROTOC=$protoc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92.0"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          shared-key: "win-pager-bin-v5-nodebug"

      - name: Disable MSVC PDB (avoid LNK4319)
        shell: pwsh
        run: |
          # Override target rustflags so link.exe never opens a PDB
          # (rustc still injects /DEBUG + .natvis by default on msvc).
          $cfg = @'

          [target.x86_64-pc-windows-msvc]
          rustflags = [
              "-C", "force-unwind-tables=yes",
              "-C", "target-feature=+crt-static",
              "-C", "debuginfo=0",
              "-C", "link-arg=/DEBUG:NONE",
          ]
          '@
          # Append — later section wins for same key in cargo? safer to rewrite windows section.
          # Replace entire file's windows target block via append of cargo config in CARGO_HOME is messy;
          # write a local override that cargo reads (config.toml already exists).
          $path = ".cargo/config.toml"
          $text = Get-Content $path -Raw
          $text = $text -replace '(?s)\[target\.x86_64-pc-windows-msvc\]\r?\nrustflags = \[[^\]]*\]', ''
          $text = $text.TrimEnd() + "`n" + $cfg + "`n"
          Set-Content -Path $path -Value $text -Encoding utf8
          Write-Host "--- .cargo/config.toml (tail) ---"
          Get-Content $path | Select-Object -Last 20

      - name: Build release binary
        shell: pwsh
        env:
          CARGO_TERM_COLOR: always
          RUST_BACKTRACE: "1"
          CARGO_PROFILE_RELEASE_DEBUG: "0"
          CARGO_PROFILE_RELEASE_STRIP: "symbols"
          CARGO_PROFILE_RELEASE_INCREMENTAL: "false"
          # Must not reintroduce /DEBUG — keep empty RUSTFLAGS so config.toml wins cleanly
        run: |
          Write-Host "Using PROTOC=$env:PROTOC"
          if (-not $env:PROTOC) { throw "PROTOC not set" }
          # Build deps + final binary; config.toml forces /DEBUG:NONE at link
          cargo build -p xai-grok-pager-bin --release
          if (-not (Test-Path target/release/xai-grok-pager.exe)) {
            throw "xai-grok-pager.exe missing after build"
          }
          Get-Item target/release/xai-grok-pager.exe | Format-List Name,Length,FullName
          Copy-Item target/release/xai-grok-pager.exe target/release/grok.exe -Force
          @"
          source_rev=$((Get-Content SOURCE_REV -ErrorAction SilentlyContinue) -join '')
          git_sha=$env:GITHUB_SHA
          built_at=$((Get-Date).ToUniversalTime().ToString('o'))
          package=xai-grok-pager-bin
          fix=paste-payload-offload (PR #2)
          "@ | Set-Content target/release/BUILD_INFO.txt

      - name: Upload grok.exe
        uses: actions/upload-artifact@v4
        with:
          name: grok-windows-x64-paste-fix
          path: |
            target/release/grok.exe
            target/release/xai-grok-pager.exe
            target/release/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 30
