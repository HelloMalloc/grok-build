name: Build Windows CLI

# Compiles HelloMalloc/grok-build (incl. paste-payload-offload fix) on a real
# Windows runner so we get a native grok.exe with the clipboard/paste fix.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "crates/codegen/xai-grok-pager/**"
      - "crates/codegen/xai-ratatui-textarea/**"
      - "crates/codegen/xai-grok-pager-bin/**"
      - "crates/codegen/xai-grok-shell/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  windows-x64:
    name: Windows x64 release
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      CARGO_TERM_COLOR: always
      # Reduce peak RAM a bit on the linker; Windows runners have ~16GB.
      CARGO_BUILD_JOBS: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "29.3"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify protoc
        shell: bash
        run: |
          protoc --version
          which protoc
          echo "PROTOC=$(which protoc)" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92.0"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: windows-x64-pager-bin

      - name: Build xai-grok-pager-bin (release)
        shell: bash
        run: |
          set -euxo pipefail
          export PROTOC="$(which protoc)"
          cargo build -p xai-grok-pager-bin --release

      - name: Stage artifact
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist
          # Cargo names the bin xai-grok-pager.exe; ship as grok.exe for users.
          cp target/release/xai-grok-pager.exe dist/grok.exe
          cp target/release/xai-grok-pager.exe dist/xai-grok-pager.exe
          # Build metadata
          {
            echo "product=grok"
            echo "commit=$(git rev-parse HEAD)"
            echo "source_rev=$(cat SOURCE_REV 2>/dev/null || true)"
            echo "package=xai-grok-pager-bin"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "runner=windows-latest"
            echo "profile=release"
            echo "paste_fix=paste-payload-offload"
          } > dist/BUILD_INFO.txt
          (cd dist && sha256sum grok.exe xai-grok-pager.exe > SHA256SUMS.txt) || \
            (cd dist && certutil -hashfile grok.exe SHA256)
          ls -lah dist/

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: grok-windows-x64
          path: dist/
          if-no-files-found: error
          retention-days: 30
